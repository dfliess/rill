<!doctype html>
<html lang="%lang%">
  <head>
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/kairos.css" />
    <!-- preloaded fonts -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/source-code/SourceCodePro-VariableFont_wght.ttf"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-Regular.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-Medium.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-SemiBold.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-Bold.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-ExtraBold.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta charset="utf-8" />
    <!-- maximum-scale suppresses the iOS auto-zoom on sub-16px inputs; since
         iOS 10 Safari ignores it for user-initiated pinch zoom, so it does
         not restrict accessibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/favicon.png"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#FBFBF9"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#232629"
    />
    <!-- The metas above only reach browser chrome inside a tab. An installed app
         takes its window colour from the manifest's theme_color, which is a single
         value: iOS paints the status bar with it and Chrome paints the desktop
         title bar with it. It is set to the antracita surface because the app is
         dark by default (theme-control.ts), so a light frame never matched what it
         framed. This meta is the older iOS lever, kept as a belt-and-braces for
         versions that ignore theme_color; "black" is opaque, so the page keeps its
         own box and needs no safe-area handling. Not "black-translucent": that one
         forces light status-bar text over the page, which would be unreadable for
         anyone who switches the app to the light theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="description"
      content="Inteligencia para empresas: dashboards, alertas e informes agénticos sobre tus datos."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kairos Agéntica" />
    <meta property="og:title" content="Kairos" />
    <meta
      property="og:description"
      content="Inteligencia para empresas: dashboards, alertas e informes agénticos sobre tus datos."
    />
    <!-- og:image: static brand avatar; TODO use the org logo upload (GCS bucket) when available -->
    <meta
      property="og:image"
      content="https://kairosagentica.com/img/logo/social/kairos-avatar-1024.png"
    />
    <meta name="twitter:card" content="summary" />
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
    <div id="rill-portal"></div>
  </body>
</html>
