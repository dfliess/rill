# Kairos-owned CI (additive; NOT part of upstream Rill).
#
# Purpose: a CLEAN green/red signal that Kairos changes don't break Rill.
# Upstream's "Test Go code" (go-test.yml) still runs the full suite, but it is
# permanently red in this fork because its cloud-integration tests need secrets
# (Druid/GCS/S3/...) the fork does not carry, so "red" there is ambiguous.
#
# This job answers "did a Kairos change break things?" unambiguously:
#   1. go build ./...  — the WHOLE Rill tree must still compile.
#   2. go test -short  — the Act/Kairos-owned packages must still pass.
#
# Act's durable execution is DBOS on Postgres and its tests dial a real database,
# so this job runs one. It used to say "it needs no external services, so green
# means green", and that was the whole problem: with no database every Act test
# called t.Skipf, `go test` printed ok, and the gate was green over 175 tests it
# never ran. That silence is how a change to the workflow's step sequence reached
# production on 2026-09-02 and killed 19 runs parked on a human approval.
#
# Two halves make the signal real, and neither works alone: the service below, and
# ACT_TEST_REQUIRE_POSTGRES, which turns "no database" into a failure here instead
# of a skip. Without the flag a broken service would put us straight back to a
# green that ran nothing.
name: Kairos unit tests

on:
  pull_request:
    branches: [kairos-main]
  push:
    branches: [kairos-main]

permissions:
  contents: read

jobs:
  kairos-unit:
    runs-on: ubuntu-22.04
    # Only this job gets the database, and only because Act needs it: Actions
    # minutes are a shared budget and the org already exhausted them once (the
    # fork had no CI at all from 2026-08-24 to 2026-09-01). Port 55432 and the
    # dbos_spike database mirror the local dbos-spike-pg container on purpose, so
    # the tests' built-in default DSN is the same string here and on a laptop.
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_PASSWORD: dbos
          POSTGRES_DB: dbos_spike
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbos_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      # duckdb and other drivers need cgo.
      - name: Whole tree compiles (Kairos must not break any Rill package)
        run: go build ./...
        env:
          CGO_ENABLED: "1"

      # scripts/kairos-tests runs the packages listed in scripts/kairos-tests/packages.txt and, comparing HEAD with
      # upstream's tip, fails if a Kairos test lives in a package nobody declared, skips without a declared reason, or
      # produces no result at all. Until 2026-09-16 this step listed four packages by hand, and the 31 tests Kairos had
      # written in twelve other packages (agent security among them) ran nowhere (kairos-cloud#166).
      #
      # -skip TestDedicatedConnector: upstream's test in ./runtime fails, rather than skipping, without S3 credentials
      # this fork does not carry.
      - name: Kairos-owned tests all run and pass
        run: |
          git fetch --no-tags --depth=1 https://github.com/rilldata/rill.git main
          go run ./scripts/kairos-tests FETCH_HEAD -- -timeout 20m -skip TestDedicatedConnector
        env:
          CGO_ENABLED: "1"
          ACT_TEST_DBOS_URL: postgres://postgres:dbos@localhost:55432/dbos_spike?sslmode=disable
          # A database that does not answer must fail this job, never skip it.
          ACT_TEST_REQUIRE_POSTGRES: "1"
