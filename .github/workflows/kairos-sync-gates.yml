# Kairos-owned CI (additive; NOT part of upstream Rill).
#
# Los cuatro gates del sync con upstream, en un unico job.
#
# Antes los ejecutaba el propio agente de la rutina dentro de su turno: cada
# `go build ./...` y cada `npm ci` volcaba sus logs al contexto de la sesion, y
# ese contexto se releia entero en cada turno posterior. Aqui los corre el
# runner y el agente solo lee el veredicto.
#
# Paridad con lo que corria el agente:
#   G1 <- kairos-unit-tests.yml       (build de todo el arbol + tests propios de
#                                      Kairos, via scripts/kairos-tests)
#         + G1c, numeracion de campos proto de Kairos (kairos-cloud#158)
#   G2 <- go-lint.yml                 (golangci-lint v2.9.0, .golangci.yml del repo)
#   G3 <- web-test-code-quality.yml   (con ADMIN/LOCAL/COMMON forzados a true)
#         + G3b, valores computados de las apariencias (scripts/style-smoke.js, kairos-cloud#242)
#   G4 <- prettier.yml
#
# Tres diferencias deliberadas respecto de lo que corria el agente:
#   - G1 MANTIENE el `-skip TestProjectStatusWaitUntilIdle`. La idea era
#     quitarlo (el runner si tiene Docker, a diferencia del sandbox del
#     agente), pero en kairos-seo ese test anade ~15 min y, sobre todo,
#     levanta ClickHouse por testcontainers: los contenedores los arranca el
#     demonio de Docker, fuera del cgroup del runner, asi que se saltarian el
#     limite de memoria que protege a Twenty CRM en esta maquina.
#   - G3 fuerza los tres filtros a true (un rebase toca de todo, y el
#     paths-filter de upstream compara contra origin/main, que en una rama de
#     sync no significa nada) y FAIL_FAST=false, para que acumule TODOS los
#     fallos en vez de parar en el primero.
#   - Los cuatro van en UN SOLO JOB, no en cuatro. Con un runner propio (un
#     agente = un job a la vez) cuatro jobs se serializarian igual pero pagando
#     cuatro checkouts y dos `npm ci`; asi G3 y G4 comparten node_modules.
#
# Cada gate lleva `continue-on-error` para que los cuatro se ejecuten siempre:
# saber que fallan G2 y G4 en la misma corrida vale mas que enterarse de uno
# por semana. Quien decide es el paso final `Veredicto`, que es el que pone el
# job en rojo, y cuya salida sale por `gh run view --log-failed`.
#
# El toolchain sale de go.mod y .nvmrc, no de un pin en este archivo: cuando
# upstream sube Go o Node, el gate lo sigue solo.
#
# DONDE CORREN: en los runners de GitHub, que es el valor por defecto de
# `runs-on` con la variable SYNC_GATES_RUNNER sin poner, que es como esta hoy.
# El runner propio (SYNC_GATES_RUNNER=kairos-seo) es la palanca para cuando la
# organizacion se quede otra vez sin minutos de Actions, no el sitio habitual:
# ya paso del 24-ago al 01-sep de 2026, y el fork se quedo sin CI entero.
#
# MEDIDO EL 25-ago-2026 en kairos-seo (4 nucleos compartidos con Twenty CRM y
# un escritorio remoto, cgroup de 4 GB), frente a un runner de GitHub:
#
#   gate                     kairos-seo        runner de GitHub
#   G1a build                ~7 min            <1 min (con la cache de setup-go)
#   G1b tests                >20 min con 4     ~21 min con los 19 paquetes
#                            paquetes          de packages.txt (~2 min cuando
#                            (timeout de go    eran 4; kairos-cloud#166)
#                            test; por eso
#                            ahora son 45m)
#   G2 golangci-lint         ~25 min, y solo   ~6 min
#                            con --concurrency=1
#                            (con la de por
#                            defecto pidio 6,8 GB
#                            y lo mato el OOM)
#   G3 web code quality      NO CABE: eslint    ~10 min
#                            necesita >3 GB de
#                            heap y el cgroup
#                            son 4 GB en total
#   G4 prettier              ~2 min            ~1 min
#
# En runners de GitHub los cinco pasos entran en ~40 min. En kairos-seo G3 no
# entra mientras esa maquina hospede el CRM, y G1b con el alcance nuevo iria
# justo contra su propio timeout: si hay que volver ahi, subir antes
# `timeout-minutes` y el `-timeout` de G1b, y contar con perder G3.
#
# OJO con el disparo manual: GitHub solo ofrece `workflow_dispatch` para
# workflows que existan en la RAMA POR DEFECTO del repo, y la de este fork no
# es `kairos-main`. Hasta que la default sea `kairos-main`, `gh workflow run`
# NO funciona: para correr los gates sobre un SHA cualquiera, pusha ese SHA a
# una rama `chore/upstream-sync-<lo-que-sea>` y el push los dispara.

name: Kairos sync gates

on:
  push:
    branches:
      - "chore/upstream-sync-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kairos-sync-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    # Variable de repo, no un valor fijo: asi se cambia de runner sin tocar
    # este archivo (cada commit aqui es un commit mas que rebasear cada
    # semana). Con SYNC_GATES_RUNNER=kairos-seo corre en la maquina propia;
    # borrando la variable vuelve a los runners de GitHub.
    runs-on: ${{ vars.SYNC_GATES_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 90

    # La ejecucion durable de Act es DBOS sobre Postgres y sus tests marcan una
    # base de verdad: sin ella hacen t.Skipf y G1b da "ok" sin ejecutar nada.
    # Ese verde mudo es el que dejo pasar el cambio que el 2026-09-02 mato 19
    # runs parados esperando una firma, y aqui pesa mas que en las PRs, porque
    # este es el gate que decide si se ADOPTA un rebase semanal.
    # Puerto y base replican el contenedor local dbos-spike-pg a proposito: el
    # DSN por defecto que llevan los tests dentro es la misma cadena aqui y en
    # un portatil. Si SYNC_GATES_RUNNER apunta a la maquina propia, esto sigue
    # valiendo: los service containers solo piden Docker, que kairos-seo tiene.
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: dbos
          POSTGRES_DB: dbos_spike
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbos_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # duckdb y otros drivers necesitan cgo.
      - name: G1a - whole tree compiles
        id: g1a
        continue-on-error: true
        run: go build ./...
        env:
          CGO_ENABLED: "1"

      # scripts/kairos-tests corre los paquetes de scripts/kairos-tests/packages.txt y, comparando HEAD con la punta de
      # upstream, falla si un test de Kairos vive en un paquete que nadie declaro, salta sin motivo declarado, o no
      # produce resultado ninguno. Hasta el 2026-09-16 este paso listaba cuatro paquetes a mano y los 31 tests que
      # Kairos habia escrito en otros doce (la seguridad de agentes entre ellos) no los corria nadie
      # (kairos-cloud#166). Hace su propio fetch de upstream, igual que G1c: cada gate se basta a si mismo, que es lo
      # que permite que los cuatro corran siempre.
      #
      # Los dos -skip son de upstream, no nuestros: TestProjectStatusWaitUntilIdle por lo dicho arriba, y
      # TestDedicatedConnector porque falla (no salta) sin credenciales de S3, que este fork no lleva.
      - name: G1b - Kairos-owned tests all run and pass
        id: g1b
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 https://github.com/rilldata/rill.git main
          go run ./scripts/kairos-tests FETCH_HEAD -- -timeout 45m -skip 'TestProjectStatusWaitUntilIdle|TestDedicatedConnector'
        env:
          CGO_ENABLED: "1"
          ACT_TEST_DBOS_URL: postgres://postgres:dbos@localhost:55432/dbos_spike?sslmode=disable
          # Sin base, este gate falla en vez de saltar. El servicio de arriba no
          # basta solo: si algun dia deja de arrancar, sin esta variable G1b
          # volveria a dar verde sin haber probado Act.
          ACT_TEST_REQUIRE_POSTGRES: "1"

      # Un campo que Kairos anade a un mensaje proto que tambien existe en upstream
      # se numera desde 1000; con un numero bajo, tarde o temprano choca con uno
      # que anade upstream (como Skill = 18 contra Agent = 18,
      # kairos-cloud#158). Compara con la punta de rilldata/rill main, que es
      # sobre la que se rebasa la rama del sync. Va dentro de G1 y no como gate
      # aparte para no cambiar la cuenta de gates que lee la rutina.
      - name: G1c - Kairos proto field numbers
        id: g1c
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 https://github.com/rilldata/rill.git main
          go run ./scripts/kairos-proto-field-numbers FETCH_HEAD

      # CGO explicito: sin el, duckdb-go-bindings queda excluido por build
      # constraints y el typecheck de golangci-lint falla con "could not
      # import ... duckdb". Es el mismo motivo por el que G1a necesita gcc.
      - name: G2 - golangci-lint
        id: g2
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: "1"
          # golangci-lint escala la memoria con la concurrencia, y en su
          # configuracion por defecto (4 goroutines en esta maquina) pidio
          # 6,8 GB y se lo llevo el OOM killer. Con una sola goroutina y un GC
          # agresivo cabe en el cgroup de 4 GB del runner, a costa de tardar
          # mas: por eso el timeout sube a 40m.
          GOGC: "20"
        with:
          version: v2.9.0
          args: --timeout 40m --concurrency=1

      - name: G3 - web code quality
        id: g3
        continue-on-error: true
        run: bash ./scripts/web-test-code-quality.sh
        env:
          ADMIN: "true"
          LOCAL: "true"
          COMMON: "true"
          FAIL_FAST: "false"
          # eslint sobre web-admin revienta con "JavaScript heap out of
          # memory" si V8 no puede crecer, asi que el limite se fija a mano en
          # vez de dejar que V8 lo deduzca de la RAM total. El 3072 anterior se
          # calibro para kairos-seo, que comparte sus 7,8 GB con Twenty CRM,
          # pero con el arbol de hoy ya no llega: el sync del 2026-09-07 salio
          # rojo por OOM aqui, y identico sobre la base, o sea que el tope era
          # la causa y no el rebase. Los gates corren en runners hosted de
          # GitHub (~16 GB, ver el runs-on de mas arriba), donde 6144 cabe de
          # sobra. Si algun dia se define SYNC_GATES_RUNNER y vuelven a
          # kairos-seo, hay que bajarlo o subir el MemoryMax=4G del servicio.
          NODE_OPTIONS: "--max-old-space-size=6144"

      # Apariencias de Kairos (kairos-cloud#242): el style guard de G3 prueba
      # que los nombres de upstream siguen existiendo; esto prueba que nuestras
      # reglas siguen ganando la cascada. Reutiliza el node_modules de G3 y
      # baja solo Chromium (~1 min). Cuenta dentro de G3 en el veredicto.
      - name: G3b - Kairos Styles computed values
        id: g3b
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          node scripts/style-smoke.js

      # Sin npm ci propio: reutiliza el node_modules que dejo G3.
      - name: G4 - prettier
        id: g4
        continue-on-error: true
        run: npx prettier --check "**/*"

      - name: Veredicto
        run: |
          g1a='${{ steps.g1a.outcome }}'
          g1b='${{ steps.g1b.outcome }}'
          g1c='${{ steps.g1c.outcome }}'
          g2='${{ steps.g2.outcome }}'
          g3='${{ steps.g3.outcome }}'
          g4='${{ steps.g4.outcome }}'
          if [ "$g1a" = "success" ] && [ "$g1b" = "success" ] && [ "$g1c" = "success" ]; then g1=success; else g1=failure; fi
          g3b='${{ steps.g3b.outcome }}'
          if [ "$g3" = "success" ] && [ "$g3b" != "success" ]; then g3=failure; fi
          green=0
          {
            echo "| Gate | Resultado |"
            echo "|---|---|"
            for pair in "G1 kairos-unit:$g1" "G2 golangci-lint:$g2" "G3 web code quality:$g3" "G4 prettier:$g4"; do
              name=${pair%:*}; res=${pair##*:}
              case "$res" in
                success) icon="VERDE"; green=$((green + 1)) ;;
                failure) icon="ROJO" ;;
                *)       icon="NO EJECUTADO ($res)" ;;
              esac
              echo "| $name | $icon |"
            done
            echo
            echo "**gates $green/4**  (G1a build=$g1a, G1b test=$g1b, G1c proto=$g1c)"
          } > gates.md
          cat gates.md >> "$GITHUB_STEP_SUMMARY"
          cat gates.md
          test "$green" -eq 4
