# Alerts — status (pass / recover / error)
# ---------------------------------------------------------------------------

[email.subject.alert_status]
other = "{{.DisplayName}} ({{.ExecutionTimeString}})"

[email.subject.alert_recovered]
other = "Recovered: {{.DisplayName}} ({{.ExecutionTimeString}})"

[email.body.alert_error]
other = "The alert failed to evaluate on <b>{{.ExecutionTimeString}}</b>. It failed with the following error message: <i>{{.ErrorMessage}}</i>."

[email.body.alert_recovered]
other = "The alert has recovered on <b>{{.ExecutionTimeString}}</b> from a previous failure."

[email.body.alert_passed]
other = "The alert has passed on <b>{{.ExecutionTimeString}}</b>."

