# English message catalog for runtime/pkg/email.
# Format: go-i18n/v2 TOML — every key uses "other" (or one/other for plurals).
# Template variables use {{.Var}} (go-i18n template syntax).

# ---------------------------------------------------------------------------
# Scheduled reports
# ---------------------------------------------------------------------------

[email.subject.scheduled_report]
other = "{{.DisplayName}} ({{.ReportTimeString}})"

[email.body.scheduled_report_ready]
other = "Your report for <b>{{.ReportTimeString}}</b> is ready to view."

[email.button.open_in_browser]
other = "Open in browser"

[email.button.view_full_analysis]
other = "View full analysis"

[email.button.download_format_file]
other = "Download {{.DownloadFormat}} file"

[email.label.edit_report]
other = "To edit this report, <a href=\"{{.EditLink}}\">click here</a>."

[email.label.unsubscribe_report]
other = "To unsubscribe from this report, <a href=\"{{.UnsubscribeLink}}\">click here</a>."

# ---------------------------------------------------------------------------
# Alerts — fail
# ---------------------------------------------------------------------------

[email.subject.alert_fail]
other = "{{.DisplayName}} ({{.ExecutionTimeString}})"

[email.body.alert_fail_trigger]
other = "Your alert triggered for <b>{{.ExecutionTimeString}}</b>. The first row that matched your alert criteria is:"

[email.label.edit_alert]
other = "To edit this alert, <a href=\"{{.EditLink}}\">click here</a>."

[email.label.unsubscribe_alert]
other = "To unsubscribe from this alert, <a href=\"{{.UnsubscribeLink}}\">click here</a>."

