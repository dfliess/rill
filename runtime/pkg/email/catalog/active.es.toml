[email.postbutton.subscription_ended]
other = "Si tiene algún comentario sobre su experiencia o cómo podemos mejorar, no dude en contactarnos por <a href=\"mailto:{{.SupportEmail}}\" style=\"color:{{.PrimaryColor}}\">correo electrónico</a>, o por chat en <a href=\"{{.ChatURL}}\" style=\"color:{{.PrimaryColor}}\">{{.ProductName}}.</a>\n<br /><br />\n¡Gracias por probar {{.ProductNameCloud}}. Esperamos verle de nuevo en el futuro!"

