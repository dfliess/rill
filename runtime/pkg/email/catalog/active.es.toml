# ---------------------------------------------------------------------------
# Prueba con créditos iniciada
# ---------------------------------------------------------------------------

[email.subject.credit_trial_started]
other = "Bienvenido a {{.ProductName}} — comience a usar su crédito de ${{.CreditAllocation}}"

[email.body.credit_trial_started]
other = "Hola,\n<br /><br />\n¡Bienvenido a {{.ProductName}}! Su cuenta está lista y cargada con <b>${{.CreditAllocation}} en crédito gratuito</b> para explorar toda la plataforma — paneles, métricas, analítica integrada, exploración con IA y más.\n<br /><br />\nSu crédito de ${{.CreditAllocation}} cubre $0.15/unidad de cómputo/hora y $1/GB de almacenamiento/mes para datos administrados superiores a 1GB. No hay límite de tiempo — su crédito solo se consume cuando sus paneles están en funcionamiento. Un proyecto típico con 4 unidades de cómputo le da algunas semanas para construir y compartir paneles reales con su equipo. ¡No olvide hibernar su proyecto cuando no lo esté usando!"

[email.button.open_product_cloud]
other = "Abrir {{.ProductNameCloud}}"

[email.postbutton.credit_trial_started]
other = "Si tiene alguna pregunta, no dude en contactarnos por <a href=\"mailto:{{.SupportEmail}}\" style=\"color:{{.PrimaryColor}}\">correo electrónico</a>, o por chat en <a href=\"{{.ChatURL}}\" style=\"color:{{.PrimaryColor}}\">{{.ProductName}}.</a> También puede visitar <a href=\"{{.DocsURL}}\" style=\"color:{{.PrimaryColor}}\">{{.DocsURL}}</a> para más información.\n<br /><br />\nFeliz exploración,"

# ---------------------------------------------------------------------------
# Crédito de prueba bajo
# ---------------------------------------------------------------------------

[email.subject.credit_trial_low]
other = "Su crédito de {{.ProductName}} se está agotando"

[email.body.credit_trial_low]
other = "Hola,\n<br /><br />\nLe quedan aproximadamente <b>${{.RemainingBalance}}</b> de su crédito original de ${{.CreditAllocation}} de {{.ProductName}}. Una vez agotado, sus paneles entrarán en hibernación.\n<br /><br />\nLa hibernación significa que sus paneles se pausan y quedan fuera de línea, pero nada se elimina. Sus modelos, conexiones de datos y configuración permanecen intactos. Actualizar a Pro reactiva todo.\n<br /><br />\nEl plan Pro es sencillo: $0.15/unidad de cómputo/hora, $1/GB de almacenamiento/mes para datos administrados superiores a 1GB, sin mínimos mensuales, y cualquier crédito gratuito restante se transfiere para que nada se desperdicie."

[email.button.upgrade_to_pro]
other = "Actualizar a Pro"

[email.postbutton.credit_trial_low]
other = "Si tiene alguna pregunta, no dude en contactarnos por <a href=\"mailto:{{.SupportEmail}}\" style=\"color:{{.PrimaryColor}}\">correo electrónico</a>, o por chat en <a href=\"{{.ChatURL}}\" style=\"color:{{.PrimaryColor}}\">{{.ProductName}}.</a>\n<br /><br />\nFeliz construcción,"

# ---------------------------------------------------------------------------
# Crédito de prueba agotado
# ---------------------------------------------------------------------------

[email.subject.credit_trial_depleted]
other = "Sus paneles de {{.ProductName}} están ahora hibernados"

[email.body.credit_trial_depleted]
other = "Hola,\n<br /><br />\nSu crédito de ${{.CreditAllocation}} de {{.ProductName}} se ha agotado y sus paneles están ahora <a href=\"{{.DocsURL}}/developers/other/FAQ#what-is-project-hibernation\" style=\"color:{{.PrimaryColor}}\">hibernados</a>. Todos los despliegues están pausados — su equipo y cualquier analítica integrada están actualmente fuera de línea.\n<br /><br />\n<b>Nada ha sido eliminado.</b> Todo su proyecto — conexiones de datos, modelos, paneles y configuración — se conserva exactamente como lo dejó.\n<br /><br />\nPara restaurar todo, actualice al plan Pro. Toma menos de un minuto: agregue un método de pago, confirme la actualización y sus paneles se reactivan con su configuración existente."

[email.postbutton.credit_trial_depleted]
other = "El precio del plan Pro es sencillo: $0.15/unidad de cómputo/hora, $1/GB de almacenamiento/mes para datos administrados superiores a 1GB. Sin contratos, sin cargos por usuario. Escale según necesite.\n<br /><br />\nSi desea discutir sus opciones o necesita un acuerdo personalizado, no dude en contactarnos por <a href=\"mailto:{{.SupportEmail}}\" style=\"color:{{.PrimaryColor}}\">correo electrónico</a>, o por chat en <a href=\"{{.ChatURL}}\" style=\"color:{{.PrimaryColor}}\">{{.ProductName}}.</a>\n<br /><br />\nEsperamos verle de vuelta pronto,"

