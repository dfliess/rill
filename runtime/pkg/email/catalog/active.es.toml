[email.subject.subscription_cancelled]
other = "{{.PlanName}} para {{.OrgName}} ha sido cancelado. Acceso disponible hasta el {{.EndDate}}"

[email.body.subscription_cancelled]
other = "¡Lamentamos verle partir!\n<br /><br />\nHa cancelado exitosamente el plan {{.PlanName}} para <b>{{.ToName}}</b>. Aún tendrá acceso a {{.ProductNameCloud}} hasta el <b>{{.EndDate}}</b>. Después de esta fecha, su suscripción expirará y ya no tendrá acceso.\n<br /><br />\nSi cambia de opinión, ¡siempre puede reactivar su suscripción!"

[email.button.billing_settings]
other = "Configuración de facturación"

[email.postbutton.subscription_cancelled]
other = "Si nuestro servicio no cumplió con sus expectativas, contáctenos por <a href=\"mailto:{{.SupportEmail}}\" style=\"color:{{.PrimaryColor}}\">correo electrónico</a>, o por chat en <a href=\"{{.ChatURL}}\" style=\"color:{{.PrimaryColor}}\">{{.ProductName}}.</a> Haremos nuestro mejor esfuerzo para atender sus comentarios e inquietudes."

