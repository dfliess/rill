<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — Kairos</title>
    <style>
      :root {
        --bg: #fbfbf9;
        --fg: #232629;
        --muted: #6b7076;
        --accent: #2c53b0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #232629;
          --fg: #fbfbf9;
          --muted: #a3a8ad;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        padding-bottom: env(safe-area-inset-bottom);
      }
      main {
        max-width: 26rem;
      }
      svg {
        width: 44px;
        height: 44px;
        margin-bottom: 20px;
      }
      .mark {
        fill: var(--fg);
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        padding: 10px 24px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 22 22" role="img" aria-label="Kairos">
        <g transform="translate(2 2)">
          <rect class="mark" x="0" y="0" width="5" height="18" />
          <rect class="mark" x="7" y="7" width="4" height="4" />
          <rect x="13" y="0" width="5" height="5" fill="#2C53B0" />
          <rect class="mark" x="13" y="13" width="5" height="5" />
        </g>
      </svg>
      <h1>Sin conexión</h1>
      <p>
        Kairos necesita conexión para mostrar tus datos. Comprueba tu red y
        vuelve a intentarlo.
      </p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
